# Runs the MailDnsAssessment Pester tests on every push.
# The tests use fixtures only and make no network calls.
name: Tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pester:
    name: Pester (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # powershell = Windows PowerShell 5.1, pwsh = PowerShell 7
        shell: [powershell, pwsh]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run Pester tests
        shell: ${{ matrix.shell }}
        run: |
          "PowerShell $($PSVersionTable.PSVersion)"
          Import-Module Pester
          "Pester $((Get-Module Pester).Version)"
          $result = Invoke-Pester -Path .\MailDnsAssessment\tests -PassThru
          "Total: $($result.TotalCount)  Passed: $($result.PassedCount)  Failed: $($result.FailedCount)"
          if ($result.TotalCount -eq 0) { Write-Error 'No tests were found.'; exit 1 }
          if ($result.FailedCount -gt 0) { exit 1 }
